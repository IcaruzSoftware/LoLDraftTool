name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: validate · lint · typecheck · test · build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Two independent pnpm workspaces (each has its own lockfile): the repo
      # root (tsx + data scripts) and app/ (the Vite frontend). Install both.
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Validate curated data
        run: pnpm validate-data

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # vitest exits after one run in non-TTY / CI environments.
      - name: Unit tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Build host (WPF + WebView2)
        run: dotnet build host -c Release
